name: self-test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq yara fonts-liberation fonts-urw-base35 python3-fonttools python3-brotli python3-pil
      - name: Built workflow and skill scripts match their sources
        run: |
          python3 build.py
          git diff --exit-code -- workflow/security-scan.yml skills/create-pr-guarded/scripts
      - name: Regression suite
        run: bash tests/run.sh
